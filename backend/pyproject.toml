[project]
name = "brahmaai-studio-backend"
version = "0.1.0"
description = "BrahmaAI Studio API foundation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.5,<3.0",
  "argon2-cffi>=23.1,<26.0",
  "alembic>=1.13,<2.0",
  "email-validator>=2.2,<3.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<10.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
