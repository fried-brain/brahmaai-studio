services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: brahmaai
      POSTGRES_USER: brahmaai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brahmaai -d brahmaai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://brahmaai:${POSTGRES_PASSWORD:-local-dev-change-me}@db:5432/brahmaai
      SESSION_COOKIE_NAME: bas_session
      SESSION_TTL_HOURS: 24
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
