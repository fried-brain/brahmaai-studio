services:
  - type: web
    name: brahmaai-studio-api
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    preDeployCommand: alembic upgrade head
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: SECURE_COOKIES
        value: "true"
      - key: SESSION_COOKIE_NAME
        value: bas_session
      - key: SESSION_TTL_HOURS
        value: "24"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LOCAL_LLM_ENABLED
        value: "false"
